[project]
name = "emotion-painting"
version = "0.1.0"
description = "Turns a diary entry's plain text into a painting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# The emotion model run on this machine (Phase 1). Left out where inference goes to the Hugging Face API.
local-model = [
    "torch>=2.9",
    "transformers>=4.57",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# AGENTS.md › Tooling says what these enforce; add a rule there only when every task needs to know it.
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # sorted imports
    "B",   # likely bugs
    "UP",  # current syntax for the pinned Python
    "SIM", # simpler equivalents
    "N",   # naming
    "ANN", # annotated signatures, no Any
    "T20", # no print
    "RUF", # ruff's own checks
]
ignore = [
    # The formatter owns line length; what it can't wrap (a long string, a URL) may stay long.
    "E501",
    # "Ambiguous" characters: the diaries are Chinese, so full-width punctuation is the data.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# CI checks talk to the workflow through stdout.
"scripts/*" = ["T20"]
# Stubs keep the names of the library they describe.
"typings/*" = ["N"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real services and are run on purpose: `uv run pytest -m live`.
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not live"]
markers = ["live: runs the real emotion model and calls the real services; see tests/test_live.py"]

[tool.coverage.run]
source_pkgs = ["emotion_painting"]
branch = true

[tool.coverage.report]
# The floor only goes up (AGENTS.md › Testing).
fail_under = 95
show_missing = true
# Unreachable by construction: the type checker proves every member is handled before it.
exclude_also = ["assert_never\\("]
skip_covered = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[[tool.uv.index]]
# CPU-only PyTorch for Linux: PyPI's Linux wheels pull in CUDA, gigabytes the CPU never uses.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
